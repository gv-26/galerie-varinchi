<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=GFS+Didot&amp;display=swap');
      .brand-text {
        font-family: 'GFS Didot', 'Didot', serif;
        font-size: 14px;
        fill: #000000;
        font-weight: bold;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>
  <!-- White rounded background -->
  <rect width="32" height="32" rx="7" fill="#ffffff"/>
  <!-- Inline border for structured, luxury feel -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Optically centered initials -->
  <text x="51.5%" y="51%" dominant-baseline="central" text-anchor="middle" class="brand-text">GV</text>
</svg>
